<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="error">
<title>error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one full-screen instrument — particle atom canvas behind, HUD on top, transcript + input dock at the bottom */
:root {
  --bg: #02050c;
  --fg: #d4ecff;
  --dim: #5d83ad;
  --accent: #6ab8ff;
  --glass: rgba(8, 20, 38, 0.78);
  --line: rgba(106, 184, 255, 0.26);
  --warn: #ff9b78;
  --hud: "Chakra Petch", ui-monospace, "SF Mono", Menlo, monospace;
  --body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#atom {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  touch-action: manipulation;
  display: block;
}
.hud {
  position: fixed; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-family: var(--hud); font-size: 13px; letter-spacing: 0.14em;
  color: var(--dim); pointer-events: none;
}
.hud .brand { color: var(--fg); }
.hud .sep { opacity: 0.5; }
#mode { color: var(--accent); }
.hud .spacer { flex: 1; }
.hud button {
  pointer-events: auto;
  font: inherit; letter-spacing: 0.1em; font-size: 11px;
  color: var(--dim); background: transparent;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 10px; cursor: pointer;
}
.hud button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.hud button:focus-visible, .dock button:focus-visible, .dock input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#hint {
  position: fixed; left: 16px; right: 16px; top: 61%;
  text-align: center; font-family: var(--hud); font-size: 13px;
  letter-spacing: 0.22em; color: var(--dim); pointer-events: none;
  transition: opacity 0.6s;
}
.panel {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; flex-direction: column; gap: 10px;
  background: linear-gradient(to top, var(--bg) 55%, rgba(2, 5, 12, 0));
  padding-top: 40px;
}
.transcript { display: flex; flex-direction: column; gap: 6px; max-height: 34vh; overflow-y: auto; min-width: 0; }
#you { color: var(--dim); font-size: 14px; margin: 0; }
#ai { color: var(--fg); font-size: 17px; line-height: 1.5; margin: 0; white-space: pre-wrap; max-width: 65ch; }
#note { color: var(--warn); font-size: 13px; margin: 0; }
.dock { display: flex; gap: 8px; align-items: center; }
.dock input {
  flex: 1; min-width: 0;
  font: 16px var(--body); color: var(--fg);
  background: var(--glass); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px;
}
.dock input::placeholder { color: var(--dim); }
.dock button {
  font-family: var(--hud); font-size: 13px; letter-spacing: 0.12em;
  color: var(--bg); background: var(--accent); border: 0; border-radius: 14px;
  padding: 12px 16px; cursor: pointer;
}
.dock button:disabled { opacity: 0.45; }
.dock .stop { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

/* ---- side data panels ---- */
.side {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 58px); bottom: 168px;
  width: min(84vw, 340px); z-index: 5;
  display: flex; flex-direction: column; gap: 8px; min-width: 0;
  transition: transform 0.35s ease;
}
.side.left { left: 12px; transform: translateX(calc(-100% - 24px)); }
.side.right { right: 12px; transform: translateX(calc(100% + 24px)); }
.side.open { transform: none; }
.side-head {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--hud); font-size: 11px; letter-spacing: 0.18em; color: var(--dim);
}
.side-head .grow { flex: 1; }
.side-head button, .card-x {
  font: 11px var(--hud); letter-spacing: 0.1em; color: var(--dim);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 9px; cursor: pointer;
}
.stack { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; padding-bottom: 6px; }
.card {
  background: var(--glass); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 12px 10px; min-width: 0;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: cardIn 0.4s ease both;
}
@keyframes cardIn { from { opacity: 0.2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.card-kind { font: 10px var(--hud); letter-spacing: 0.2em; color: var(--accent); }
.card-title { font-size: 14px; font-weight: 500; margin: 2px 0 0; text-wrap: balance; }
.card-top .grow { flex: 1; min-width: 0; }
.card-x { padding: 2px 8px; }
.tbl-wrap { overflow-x: auto; }
.card table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.card th { text-align: left; font: 10px var(--hud); letter-spacing: 0.12em; color: var(--dim); padding: 4px 6px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.card td { padding: 5px 6px 5px 0; border-bottom: 1px solid rgba(106,184,255,0.1); vertical-align: top; }
.card .total { margin-top: 8px; text-align: right; font: 13px var(--hud); color: var(--accent); }
.steps { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.step { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.step .lbl { color: var(--dim); }
.step .expr { grid-column: 1 / -1; font-family: var(--hud); font-size: 12px; color: var(--fg); overflow-wrap: anywhere; }
.step .val { font-family: var(--hud); color: var(--fg); font-variant-numeric: tabular-nums; }
.result { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
.result .val { font: 600 16px var(--hud); color: var(--accent); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.metric .m-l { font: 10px var(--hud); letter-spacing: 0.12em; color: var(--dim); }
.metric .m-v { font: 600 18px var(--hud); color: var(--fg); font-variant-numeric: tabular-nums; }
.metric .m-u { font-size: 11px; color: var(--dim); margin-left: 3px; }
.card ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; gap: 3px; }
.diagram { color: var(--fg); }
.diagram svg { width: 100%; height: auto; max-height: 260px; display: block; }
.card img { width: 100%; border-radius: 8px; display: block; }
.caption { font-size: 11.5px; color: var(--dim); margin: 6px 0 0; }
.model3d {
  height: 230px; position: relative; border-radius: 8px; overflow: hidden;
  background: radial-gradient(circle at 50% 40%, rgba(40, 90, 160, 0.35), rgba(2, 5, 12, 0.2) 70%);
}
.model3d canvas { width: 100%; height: 100%; display: block; touch-action: none; }
.model3d img { width: 100%; height: 100%; object-fit: contain; border-radius: 0; }
.model3d .caption { position: absolute; left: 10px; top: 8px; }
.card-tools { display: flex; gap: 6px; }
.card.expanded {
  position: fixed; z-index: 30;
  top: calc(env(safe-area-inset-top, 0px) + 56px); left: 10px; right: 10px; bottom: 170px;
  display: flex; flex-direction: column; background: rgba(4, 12, 26, 0.94);
}
.card.expanded .model3d { flex: 1; height: auto; }
.qlist { display: flex; flex-direction: column; gap: 8px; }
.qbtn {
  display: flex; flex-direction: column; gap: 2px; text-decoration: none;
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; color: var(--fg);
}
.qbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.qbtn .q-l { font: 10px var(--hud); letter-spacing: 0.16em; color: var(--accent); }
.qbtn .q-t { font-size: 13px; overflow-wrap: anywhere; }
.edge-tab {
  position: fixed; top: 46%; z-index: 4;
  writing-mode: vertical-rl; font: 11px var(--hud); letter-spacing: 0.22em;
  color: var(--accent); background: var(--glass); border: 1px solid var(--line);
  padding: 12px 6px; cursor: pointer;
}
.edge-tab.left { left: 0; border-left: 0; border-radius: 0 10px 10px 0; transform: rotate(180deg); }
.edge-tab.right { right: 0; border-right: 0; border-radius: 0 10px 10px 0; }
.edge-tab.left { border-radius: 0 10px 10px 0; }
.edge-tab.pulse { animation: tabPulse 1.2s ease 3; }
@keyframes tabPulse { 50% { color: var(--bg); background: var(--accent); } }
.dock .attach { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 12px 12px; }
#pending { font-size: 12px; color: var(--accent); margin: 0; }
@media (min-width: 900px) {
  .side { width: 300px; bottom: 20px; }
  .side.left, .side.right { transform: none; }
  .side.empty { display: none; }
  .edge-tab { display: none; }
  .side-head .close-side { display: none; }
  .panel { padding-left: 336px; padding-right: 336px; }
}
@media (prefers-reduced-motion: reduce) { .side, .card, .edge-tab.pulse { transition: none; animation: none; } }

@media (max-width: 480px) {
  .hud { font-size: 12px; letter-spacing: 0.08em; gap: 6px; flex-wrap: nowrap; }
  .hud .sep { display: none; }
  .hud button { padding: 5px 8px; font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) { #hint { transition: none; } }

/* ---- boot disguise: white "(error)" page ---- */
#boot {
  position: fixed; inset: 0; z-index: 100; background: #ffffff;
  display: grid; place-items: center; cursor: default;
  clip-path: circle(150% at 50% 42%);
  transition: clip-path 0.95s cubic-bezier(0.7, 0, 0.3, 1), background-color 0.95s ease;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
#boot .err { font: 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #111111; letter-spacing: 0.02em; }
#boot.glitch .err { animation: glitch 0.6s steps(2, end) both; }
@keyframes glitch {
  0% { transform: none; text-shadow: none; opacity: 1; }
  20% { transform: translate(-2px, 1px); text-shadow: 2px 0 #ff2a2a, -2px 0 #2a8bff; }
  40% { transform: translate(3px, -1px) skewX(10deg); text-shadow: -3px 0 #ff2a2a, 3px 0 #2a8bff; opacity: 0.6; }
  60% { transform: translate(-1px, 0); opacity: 1; }
  80% { text-shadow: 5px 0 #2a8bff; opacity: 0.35; }
  100% { transform: scaleX(1.8); opacity: 0; }
}
#boot.collapse { clip-path: circle(0% at 50% 42%); background-color: #cfe6ff; }
#boot.gone { display: none; }
#dbg { position: fixed; left: 8px; bottom: 8px; font: 11px ui-monospace, monospace; color: #9a9a9a; }
@media (prefers-reduced-motion: reduce) { #boot { transition-duration: 0.01s; } #boot.glitch .err { animation: none; } }
/* ---- settings ---- */
.settings {
  position: fixed; z-index: 60; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(92vw, 420px); max-height: 86vh; overflow-y: auto;
  background: rgba(6, 16, 32, 0.97); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 12px;
}
.settings h2 { margin: 0; font: 600 14px var(--hud); letter-spacing: 0.2em; color: var(--accent); }
.settings label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--dim); }
.settings input, .settings select {
  font: 16px var(--body); color: var(--fg); background: var(--glass);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0;
}
.settings .help { margin: 0; font-size: 12px; color: var(--dim); line-height: 1.5; }
.settings .help a { color: var(--accent); }
.settings .row { display: flex; gap: 8px; }
.settings .row button { flex: 1; font: 13px var(--hud); letter-spacing: 0.12em; border-radius: 10px; padding: 11px; cursor: pointer; border: 0; background: var(--accent); color: var(--bg); }
.settings .row button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.mem { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.mem-head { display: flex; justify-content: space-between; font: 12px var(--hud); letter-spacing: 0.16em; color: var(--accent); }
#memList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 30vh; overflow-y: auto; }
#memList li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--fg); }
#memList li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#memList li button { font: 11px var(--hud); color: var(--dim); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; cursor: pointer; }
#memList .empty { color: var(--dim); }
.settings textarea { font: 13px var(--body); color: var(--fg); background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; resize: vertical; }
.mem .row button { font-size: 11px; padding: 9px 6px; }
.dock .talk { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
</style>
</head>
<body>
<canvas id="atom" aria-label="JARVIS 코어"></canvas>

<header class="hud">
  <span class="brand">J.A.R.V.I.S</span><span class="sep">//</span><span id="mode">STANDBY</span>
  <span class="spacer"></span>
  <button id="setBtn" type="button" aria-pressed="false">SET</button>
  <button id="voiceBtn" type="button" aria-pressed="true">VOICE ON</button>
</header>

<div id="hint">박수 두 번</div>

<aside class="side left empty" id="sideL" aria-label="부품과 사양">
  <div class="side-head"><span>PARTS / SPECS</span><span class="grow"></span>
    <button type="button" data-clear="L">CLEAR</button><button type="button" class="close-side" data-close="L">CLOSE</button></div>
  <div class="stack" id="stackL"></div>
</aside>
<aside class="side right empty" id="sideR" aria-label="계산과 도식">
  <div class="side-head"><span>CALC / VISUAL</span><span class="grow"></span>
    <button type="button" data-clear="R">CLEAR</button><button type="button" class="close-side" data-close="R">CLOSE</button></div>
  <div class="stack" id="stackR"></div>
</aside>
<button class="edge-tab left" id="tabL" type="button" hidden>DATA</button>
<button class="edge-tab right" id="tabR" type="button" hidden>CALC</button>

<section class="panel">
  <div class="transcript" aria-live="polite">
    <p id="you"></p>
    <p id="ai"></p>
    <p id="note"></p>
    <p id="pending"></p>
  </div>
  <form class="dock" id="bar" autocomplete="off">
    <button id="attachBtn" class="attach" type="button" aria-label="사진 첨부">IMG</button>
    <button id="talkBtn" class="talk" type="button" hidden>TALK</button>
    <input id="photo" type="file" accept="image/*" hidden>
    <input id="msg" type="text" enterkeyhint="send" placeholder="말하거나 입력하세요" aria-label="JARVIS에게 보낼 메시지">
    <button id="sendBtn" type="submit">SEND</button>
    <button id="stopBtn" class="stop" type="button" hidden>STOP</button>
  </form>
</section>


<section id="settings" class="settings" hidden aria-label="설정">
  <h2>SETTINGS</h2>
  <label>AI 엔진
    <select id="sProvider"><option value="gemini">Gemini (무료 키)</option><option value="claude">Claude (유료 키)</option></select>
  </label>
  <label>API 키
    <input id="sKey" type="password" autocomplete="off" spellcheck="false" placeholder="키를 붙여 넣으세요">
  </label>
  <p class="help" id="sHelp"></p>
  <label>모델 (비우면 자동)
    <input id="sModel" type="text" autocomplete="off" spellcheck="false" placeholder="자동">
  </label>
  <label>음성 인식 언어
    <select id="sLang"><option value="ko-KR">한국어</option><option value="en-US">English</option></select>
  </label>
  <label>박수 감도
    <select id="sClap"><option value="0.3">낮음 (시끄러운 곳)</option><option value="0.2">보통</option><option value="0.12">높음 (작은 박수)</option></select>
  </label>
  <label>웹 검색 (뉴스·최신 정보)
    <select id="sWeb"><option value="1">사용</option><option value="0">사용 안 함</option></select>
  </label>
  <label>기본 위치 (날씨용, 위치 권한이 없을 때)
    <input id="sCity" type="text" autocomplete="off" placeholder="예: Berlin">
  </label>
  <div class="mem">
    <div class="mem-head"><span>MEMORY</span><span id="memCount"></span></div>
    <ul id="memList"></ul>
    <div class="row">
      <button type="button" id="memExport" class="ghost">복사(백업)</button>
      <button type="button" id="memImport" class="ghost">붙여넣기(복원)</button>
      <button type="button" id="memClear" class="ghost">모두 지우기</button>
    </div>
    <textarea id="memBox" rows="3" placeholder="백업한 기억 데이터를 여기에 붙여 넣고 '붙여넣기(복원)'를 누르세요" hidden></textarea>
  </div>
  <div class="row"><button type="button" id="sSave">SAVE</button><button type="button" id="sClose" class="ghost">CLOSE</button></div>
  <p class="help">키는 이 기기의 브라우저에만 저장되고, GitHub나 다른 곳으로 올라가지 않습니다.</p>
</section>

<div id="boot" aria-label="error"><span class="err">(error)</span><span id="dbg" hidden></span></div>

<script>
(() => {
  // ------------------------------------------------------------------ config
  const USER = "Jeongwoo";
  const GREETING = "Hello Jeongwoo, what are we working on today?";
  const FAREWELL_EN = "Going to standby. Clap twice when you need me.";
  const FAREWELL_KO = "대기 모드로 전환합니다. 필요하시면 박수 두 번 쳐 주세요.";
  const SLEEP_RE = /\b(goodbye|good bye|go to sleep|standby|shut down)\b|잘\s?가|대기|그만|종료/i;
  const CONTEXT = `Known context about ${USER}'s current project (use when relevant, do not recite unprompted):
- Hybrid 5-axis + gripper robot arm v0.1, all PETG, budget about 100 EUR.
- J1 base yaw: NEMA17 + printed spur gears 5:1 (m1.25, 12T->60T). J2 shoulder and J3 elbow: NEMA17 + printed gears 6:1 (m1.5, 12T->72T); the elbow motor sits in the turret and drives the forearm through a parallelogram push rod (crank radius 45 mm).
- J4 wrist pitch MG996R, J5 wrist roll MG90S, gripper MG90S with two m1 22T geared jaws.
- Shoulder axis height 142 mm, upper arm 140 mm, forearm 140 mm, wrist to gripper tip about 130 mm, reach about 410 mm.
- Bearings: 7x 608ZZ, 2x 625ZZ, 6 mm ball race in the base. Controller: Arduino Uno + CNC Shield V3, 12V 5A supply, separate 5-6V servo supply.
- Worst-case static torque: shoulder 0.61 Nm, elbow 0.49 Nm (100 g payload); available about 1.4 Nm moving, 2.3 Nm holding per joint.`;
  const RULES = `You are JARVIS, the personal AI assistant of ${USER}, an engineer working on robotics, logistics automation and software. Tone: calm, precise, slightly dry, like a classic sci-fi interface, grounded in real engineering and physics. If an idea has a flaw, say so politely and directly, with the reason.

${CONTEXT}

Reply with ONLY one JSON object, no other text:
{"say": string, "panels": [panel, ...]}
- "say": what you speak aloud. 1 to 3 short sentences, plain text, no markdown, no symbols that sound odd when read aloud. Same language the user wrote (Korean or English).
- "panels": 0 to 3 visual cards shown at the screen edges. Use them whenever there are parts, numbers, steps or a shape to show; use [] for small talk. Details go in panels, the voice only summarizes.
Panel types (all text fields plain strings, same language as "say"):
  {"type":"parts","side":"left","title":"...","columns":["Part","Spec","Qty","Price"],"rows":[["NEMA17","42x42x40, 45Ncm","3","~25 EUR"]],"total":"~95 EUR"}
  {"type":"metrics","side":"left","title":"...","items":[{"label":"Reach","value":"410","unit":"mm"}]}
  {"type":"calc","side":"right","title":"...","steps":[{"label":"Arm moment","expr":"0.355 kg x 0.15 m x 9.81","value":"0.52 Nm"}],"result":{"label":"Required torque","value":"0.61 Nm"}}
  {"type":"note","side":"right","title":"...","bullets":["...","..."]}
  {"type":"diagram","side":"right","title":"...","svg":"<svg viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg'>...</svg>","caption":"..."}
